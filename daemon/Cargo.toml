[package]
name = "piop-daemon"
version = "0.1.0"
edition = "2021"
default-run = "piopd"

[lib]
name = "piop_daemon"

[[bin]]
name = "piopd"
path = "src/daemon_main.rs"

[features]
test-home = []

[dependencies]
piop-protocol = { path = "../protocol" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "process", "sync", "time", "net", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
portable-pty = "0.9"
