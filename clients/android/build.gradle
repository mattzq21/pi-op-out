// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

project(':capacitor-cordova-android-plugins') {
    pluginManager.withPlugin('com.android.library') {
        dependencies.add('implementation', dependencies.platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
    }
}

subprojects {
    if (projectDir.toPath().startsWith(rootProject.projectDir.toPath())) return
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("dependencies/${project.name}"))
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
