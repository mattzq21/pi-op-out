<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi request viewer</title>
<style>
:root{color-scheme:dark;--bg:#151513;--panel:#1d1d1a;--line:#39372f;--ink:#ebe7dd;--muted:#9d998e;--accent:#e07843;--blue:#79addf;--green:#82bc98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;padding:18px max(18px,calc((100vw - 1160px)/2));border-bottom:1px solid var(--line);background:#151513f2;backdrop-filter:blur(12px)}h1{margin:0;font:600 22px/1.2 system-ui}.subtitle{margin:5px 0 14px;color:var(--muted);font-size:12px}.filters{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,minmax(125px,175px));gap:8px}input,select,button{height:36px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);padding:0 10px}input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}main{max-width:1160px;margin:auto;padding:16px 18px 48px}.meta{display:flex;justify-content:space-between;gap:12px;margin:0 2px 12px;color:var(--muted);font:11px ui-monospace,monospace}.requests{display:grid;gap:10px}.request{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:9px;background:var(--panel);overflow:hidden}.request-head{padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px}.request-title{display:grid;gap:3px;min-width:0}.request-title strong{font-size:13px}.request-title small{color:var(--muted);font:10px ui-monospace,monospace}.number{color:var(--blue);font:600 11px ui-monospace,monospace}.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.tag{border:1px solid #4a473e;border-radius:10px;padding:1px 6px;color:var(--blue);font:9px ui-monospace,monospace}.tag.skill{color:var(--green)}.sections{border-top:1px solid var(--line)}details+details{border-top:1px solid #2d2c27}summary{min-height:38px;padding:9px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:#d4d0c7}summary::-webkit-details-marker{display:none}summary:before{content:"›";color:var(--muted);font-size:16px;transition:.12s}details[open]>summary:before{transform:rotate(90deg)}summary span{margin-left:auto;color:var(--muted);font:10px ui-monospace,monospace}pre{max-height:70vh;overflow:auto;margin:0;padding:14px;border-top:1px solid #2d2c27;background:#11110f;color:#d4d0c7;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.more{display:block;margin:18px auto 0;min-width:180px}.more:hover{border-color:var(--accent)}.empty{text-align:center;color:var(--muted);padding:50px 15px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.error{color:#e58c78}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.request-head{grid-template-columns:auto 1fr}.tags{grid-column:2;justify-content:flex-start}}
.number{font-size:20px;font-weight:700;line-height:1}
</style>
</head>
<body>
<header>
  <h1>Pi provider requests</h1>
  <p class="subtitle">Exact JSON bodies captured immediately before Pi sends them. HTTP headers are not included.</p>
  <div class="filters">
    <input id="search" type="search" placeholder="Search literal request bodies…" aria-label="Search request bodies">
    <select id="role" aria-label="Content type"><option value="">Any content</option><option value="system">System instructions</option><option value="user">User messages</option><option value="assistant">Assistant messages</option><option value="tool-call">Tool calls</option><option value="tool-result">Tool results</option></select>
    <select id="model" aria-label="Model"><option value="">Any model</option></select>
    <select id="tool" aria-label="Available tool"><option value="">Any tool</option></select>
    <select id="skill" aria-label="Available skill"><option value="">Any skill</option></select>
  </div>
</header>
<main><div class="meta"><span id="status">Loading first 256 KiB…</span><span id="source"></span></div><div id="requests" class="requests"></div><button id="more" class="more" type="button" hidden>Load next 256 KiB</button></main>
<script>
const CONTEXT="pi-desktop-llm-context",state={requests:[],offset:0,done:false,tail:"",decoder:new TextDecoder(),loading:false,lines:0};
const $=id=>document.getElementById(id),array=value=>Array.isArray(value)?value:[],unique=values=>[...new Set(values.filter(Boolean))];
function requestMessages(p){return array(p?.messages).length?p.messages:array(p?.input).length?p.input:array(p?.contents).length?p.contents:array(p?.context?.messages)}
function requestTools(p){const direct=array(p?.tools).length?p.tools:array(p?.context?.tools);return direct.flatMap(tool=>array(tool?.functionDeclarations).length?tool.functionDeclarations:tool)}
function toolName(tool){return tool?.name||tool?.function?.name||tool?.functionDeclaration?.name||tool?.id}
function text(value){if(typeof value==="string")return value;if(Array.isArray(value))return value.map(text).filter(Boolean).join("\n");if(!value||typeof value!=="object")return "";return text(value.text??value.content??value.parts??value.value??"")}
function instructions(p){return unique([text(p?.instructions),text(p?.system),text(p?.system_instruction),text(p?.systemInstruction),text(p?.context?.systemPrompt)])}
function rolesOf(messages,hasSystem){const roles=new Set(hasSystem?["system"]:[]);function add(value){if(!value||typeof value!=="object")return;const role=value.role==="model"?"assistant":value.role;if(["user","assistant","system"].includes(role))roles.add(role);const type=String(value.type||"").toLowerCase();if(type.includes("tool")&&type.includes("result")||type.includes("function")&&type.includes("output")||role==="tool")roles.add("tool-result");if(type.includes("tool")&&type.includes("use")||type.includes("function")&&type.includes("call"))roles.add("tool-call");Object.values(value).forEach(child=>{if(Array.isArray(child))child.forEach(add)})}messages.forEach(add);return roles}
function unescapeXml(value){return value.replaceAll("&lt;","<").replaceAll("&gt;",">").replaceAll("&quot;",'"').replaceAll("&apos;","'").replaceAll("&amp;","&")}
function skillSchemasOf(raw){const skills=[];for(const block of raw.matchAll(/<available_skills>[\s\S]*?<\/available_skills>/g)){for(const match of block[0].matchAll(/<skill>\s*<name>([\s\S]*?)<\/name>\s*<description>([\s\S]*?)<\/description>\s*<location>([\s\S]*?)<\/location>\s*<\/skill>/g))skills.push({name:unescapeXml(match[1].trim()),description:unescapeXml(match[2].trim()),location:unescapeXml(match[3].trim())})}return skills}
function skillsOf(raw){return unique(skillSchemasOf(raw).map(skill=>skill.name))}
function option(select,value){if(value&&!Array.from(select.options).some(item=>item.value===value)){const node=document.createElement("option");node.value=value;node.textContent=value;select.append(node)}}
function parseRequest(payload,timestamp){const body=JSON.stringify(payload),messages=requestMessages(payload),toolSchemas=requestTools(payload),tools=unique(toolSchemas.map(toolName)),systems=instructions(payload),skillSource=systems.join("\n\n"),skillSchemas=skillSchemasOf(skillSource),skills=skillsOf(skillSource),model=String(payload.model||payload.context?.model||"unknown"),roles=rolesOf(messages,systems.length>0),settings=Object.fromEntries(Object.entries(payload).filter(([key])=>!["instructions","system","system_instruction","systemInstruction","messages","input","contents","tools","context"].includes(key)));return{payload,body,messages,toolSchemas,tools,systems,skillSchemas,skills,model,roles,settings,timestamp}}
function parseLine(raw){if(!raw.trim())return;state.lines++;let entry;try{entry=JSON.parse(raw)}catch{return}if(entry?.type==="session"){$("source").textContent=entry.cwd||entry.id||"";document.title=`${entry.id||"Pi"} · request viewer`}if(entry?.customType!==CONTEXT||!entry.data||typeof entry.data!=="object")return;const request=parseRequest(entry.data,entry.timestamp);state.requests.push(request);option($("model"),request.model);request.tools.forEach(value=>option($("tool"),value));request.skills.forEach(value=>option($("skill"),value))}
function completeLines(chunk,done){const lines=(state.tail+chunk).split("\n");state.tail=lines.pop()||"";if(done&&state.tail){lines.push(state.tail);state.tail=""}return lines}
function matches(request){const query=$("search").value.trim().toLowerCase(),role=$("role").value;return(!query||request.body.toLowerCase().includes(query))&&(!role||request.roles.has(role))&&(!$("model").value||request.model===$("model").value)&&(!$("tool").value||request.tools.includes($("tool").value))&&(!$("skill").value||request.skills.includes($("skill").value))}
function lazySection(label,value,count){const details=document.createElement("details"),summary=document.createElement("summary"),meta=document.createElement("span");summary.append(label,meta);meta.textContent=count;details.append(summary);details.addEventListener("toggle",()=>{if(!details.open||details.children.length>1)return;const pre=document.createElement("pre");pre.textContent=typeof value==="string"?value:JSON.stringify(value,null,2);details.append(pre)},{once:true});return details}
function render(){const root=$("requests"),visible=state.requests.filter(matches),fragment=document.createDocumentFragment();root.replaceChildren();visible.forEach(request=>{const card=document.createElement("article"),head=document.createElement("div"),number=document.createElement("span"),title=document.createElement("div"),strong=document.createElement("strong"),small=document.createElement("small"),sections=document.createElement("div");card.className="request";head.className="request-head";number.className="number";number.textContent=`#${state.requests.indexOf(request)+1}`;title.className="request-title";strong.textContent=request.model;small.textContent=`${request.messages.length} messages · ${request.tools.length} tools · ${request.skills.length} skills · ${(request.body.length/1024).toFixed(1)} KiB · ${request.timestamp?.slice(11,19)||"—"}`;title.append(strong,small);head.append(number,title);sections.className="sections";if(request.systems.length)sections.append(lazySection("System instructions",request.systems.join("\n\n"),`${request.systems.join("").length.toLocaleString()} chars`));sections.append(lazySection("Messages / input",request.messages,`${request.messages.length}`));if(request.toolSchemas.length)sections.append(lazySection("Available tool schemas",request.toolSchemas,`${request.tools.length}`));if(request.skillSchemas.length)sections.append(lazySection("Available skills",request.skillSchemas,`${request.skillSchemas.length}`));if(Object.keys(request.settings).length)sections.append(lazySection("Request settings",request.settings,`${Object.keys(request.settings).length} fields`));sections.append(lazySection("Literal request body",request.payload,`${(request.body.length/1024).toFixed(1)} KiB`));card.append(head,sections);fragment.append(card)});root.append(fragment);if(!visible.length){const empty=document.createElement("div");empty.className="empty";const title=document.createElement("strong");title.textContent=state.requests.length?"No captured requests match these filters.":"No captured provider requests in the loaded data.";empty.append(title,state.requests.length?"Clear another filter or load more data.":"Only responses created after request capture was installed can appear here.");root.append(empty)}$("status").textContent=`${visible.length.toLocaleString()} shown · ${state.requests.length.toLocaleString()} requests · ${state.lines.toLocaleString()} JSONL records scanned · ${(state.offset/1048576).toFixed(1)} MiB read${state.done?" · complete":""}`}
async function load(){if(state.loading||state.done)return;state.loading=true;$("more").disabled=true;try{const response=await fetch(`chunk?offset=${state.offset}`);if(!response.ok)throw new Error(await response.text());const bytes=new Uint8Array(await response.arrayBuffer());state.offset=Number(response.headers.get("X-Next-Offset"));state.done=response.headers.get("X-Log-Done")==="true";completeLines(state.decoder.decode(bytes,{stream:!state.done}),state.done).forEach(parseLine);render();$("more").hidden=state.done}catch(error){$("status").textContent=String(error);$("status").className="error"}finally{state.loading=false;$("more").disabled=false}}
[$("search"),$("role"),$("model"),$("tool"),$("skill")].forEach(control=>control.addEventListener("input",render));$("more").addEventListener("click",load);
const skillXml='<available_skills>\n<skill>\n<name>demo</name>\n<description>A &amp; B</description>\n<location>/demo/SKILL.md</location>\n</skill>\n</available_skills>',sample=parseRequest({model:"gpt-test",instructions:skillXml,input:[{role:"user",content:"hello"},{type:"function_call",name:"read"}],tools:[{type:"function",name:"read"}]}),nested=parseRequest({model:"pi-test",context:{systemPrompt:"system",messages:[{role:"assistant",content:[]}],tools:[{name:"write"}]}}),skill=sample.skillSchemas[0];console.assert(sample.messages.length===2&&sample.tools[0]==="read"&&sample.roles.has("tool-call")&&sample.roles.has("system")&&nested.tools[0]==="write"&&nested.roles.has("assistant"),"request parser self-check");console.assert(skill.name==="demo"&&skill.description==="A & B"&&sample.skills[0]==="demo","skill parser self-check");console.assert(!completeLines('{"type":',false).length&&completeLines('"custom"}\n',false)[0]==='{"type":"custom"}',"chunk boundary self-check");
load();
</script>
</body></html>
