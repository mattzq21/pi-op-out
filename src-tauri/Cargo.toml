[package]
name = "piop"
version = "0.1.0"
description = "piop: a native interface for the Pi coding agent"
authors = ["piop contributors"]
edition = "2021"

[lib]
name = "piop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[lints.clippy]
cognitive_complexity = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
portable-pty = "0.9"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"
