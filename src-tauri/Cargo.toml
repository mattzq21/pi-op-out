[package]
name = "piop"
version = "0.1.0"
description = "piop: a native interface for the Pi coding agent"
authors = ["piop contributors"]
edition = "2021"
default-run = "piop"

[lib]
name = "piop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:gtk", "dep:webkit2gtk"]
daemon = []
webdriver = ["desktop", "dep:tauri-plugin-wdio-webdriver"]

[[bin]]
name = "piop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "piop-daemon"
path = "src/daemon_main.rs"
required-features = ["daemon"]

[lints.clippy]
cognitive_complexity = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "process", "sync", "time", "net", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
portable-pty = "0.9"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2", optional = true }
