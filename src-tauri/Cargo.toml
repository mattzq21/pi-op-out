[package]
name = "piop-desktop"
version = "0.1.0"
description = "piop: a native interface for the Pi coding agent"
authors = ["piop contributors"]
edition = "2021"
default-run = "piop"

[lib]
name = "piop_desktop"
crate-type = ["rlib"]

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[[bin]]
name = "piop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
piop-protocol = { path = "crates/protocol" }
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "io-std", "macros", "process", "sync", "time", "net", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = "0.3"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
webkit2gtk = { version = "2" }

[profile.dev]
debug = "line-tables-only"

[workspace]
members = ["crates/daemon", "crates/protocol"]
default-members = ["."]
resolver = "2"
