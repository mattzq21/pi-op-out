version = 1
name = "piop"

[setup]
script = ""

[setup.linux]
script = '''
set -eu

if ! git symbolic-ref -q HEAD >/dev/null; then
  worktree_id=$(basename "$(dirname "$PWD")")
  git switch -c "codex/tmp-$worktree_id"
fi

repo_root=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")
cache_source="$repo_root/src-tauri/target"

if [ -d "$cache_source" ] && [ ! -e src-tauri/target ]; then
  mkdir -p src-tauri
  cp -a --reflink=auto "$cache_source" src-tauri/target
fi'''

[cleanup]
script = ""

[cleanup.linux]
script = '''
set -eu

branch=$(git symbolic-ref --quiet --short HEAD || true)

case "$branch" in
  codex/tmp-*)
    git switch --detach
    git branch -D "$branch"

    if [ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]; then
      git push origin --delete "$branch"
    fi
    ;;
esac'''
